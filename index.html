<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/thisisnotalms/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site-wide fallback. It was one lesson's title for a long time,
         which every route then inherited — a single-page app never reloads
         this file. PageMeta (src/components/layout/PageMeta.tsx) overwrites
         both of these per route once the app boots; what is here is what a
         crawler and a link preview see before that happens, so it has to
         describe the site rather than any one page. -->
    <meta name="description" content="Hands-on, interactive lessons in databases, information systems planning, IT project management and business analytics, by Yasas Sri Wickramasinghe. No logins, no busywork — everything runs in your own browser." />
    <meta property="og:title" content="Not a LMS · Yasas Sri Wickramasinghe" />
    <meta property="og:description" content="Hands-on, interactive lessons in databases, information systems planning, IT project management and business analytics. No logins — everything runs in your own browser." />
    <meta property="og:type" content="website" />
    <title>Not a LMS · Yasas Sri Wickramasinghe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter drives the app. Manrope / DM Sans / JetBrains Mono are the
         faces used by the public course pages (see src/styles/courseTheme.css);
         kept in the same request so those pages never render their headlines
         in a fallback face. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
