<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" width="660" font-family="DM Sans, sans-serif">
  <!-- composite: Address branching -->
  <g>
    <text x="110" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1b2a">Composite</text>
    <g stroke="#5b6b7c" stroke-width="1.3">
      <line x1="110" y1="80" x2="45" y2="130"/>
      <line x1="110" y1="80" x2="110" y2="130"/>
      <line x1="110" y1="80" x2="175" y2="130"/>
    </g>
    <ellipse cx="110" cy="62" rx="62" ry="22" fill="#e6f4f2" stroke="#0d9488" stroke-width="2"/>
    <text x="110" y="66" text-anchor="middle" font-size="11.5" fill="#0d1b2a">Address</text>
    <ellipse cx="42" cy="146" rx="40" ry="16" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="42" y="150" text-anchor="middle" font-size="9" fill="#0d1b2a">Street</text>
    <ellipse cx="110" cy="146" rx="34" ry="16" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="110" y="150" text-anchor="middle" font-size="9" fill="#0d1b2a">City</text>
    <ellipse cx="180" cy="146" rx="40" ry="16" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="180" y="150" text-anchor="middle" font-size="9" fill="#0d1b2a">PostCode</text>
    <text x="110" y="190" text-anchor="middle" font-size="9" fill="#5b6b7c">one value, made of parts —</text>
    <text x="110" y="203" text-anchor="middle" font-size="9" fill="#5b6b7c">only the leaves become columns</text>
  </g>
  <!-- multivalued -->
  <g>
    <text x="330" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1b2a">Multivalued</text>
    <ellipse cx="330" cy="62" rx="72" ry="24" fill="#fdf3e0" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="330" cy="62" rx="62" ry="17" fill="none" stroke="#f59e0b" stroke-width="1.4"/>
    <text x="330" y="66" text-anchor="middle" font-size="11" fill="#0d1b2a">{PhoneNumber}</text>
    <text x="330" y="120" text-anchor="middle" font-size="9" fill="#5b6b7c">double ellipse — many values at once</text>
    <text x="330" y="133" text-anchor="middle" font-size="9" fill="#5b6b7c">021-555-1234 and 09-888-9999</text>
    <text x="330" y="190" text-anchor="middle" font-size="9" fill="#5b6b7c">maps to a separate table:</text>
    <text x="330" y="203" text-anchor="middle" font-size="9" font-family="DM Mono, monospace" fill="#0d1b2a">CUSTOMER_PHONE(cust_id, phone)</text>
  </g>
  <!-- derived -->
  <g>
    <text x="550" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1b2a">Derived</text>
    <ellipse cx="550" cy="62" rx="55" ry="22" fill="#f6f8fb" stroke="#5b6b7c" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="550" y="66" text-anchor="middle" font-size="11" fill="#0d1b2a">(Age)</text>
    <text x="550" y="120" text-anchor="middle" font-size="9" fill="#5b6b7c">dashed ellipse — computed,</text>
    <text x="550" y="133" text-anchor="middle" font-size="9" fill="#5b6b7c">never stored</text>
    <text x="550" y="190" text-anchor="middle" font-size="9" fill="#5b6b7c">Age from DateOfBirth,</text>
    <text x="550" y="203" text-anchor="middle" font-size="9" fill="#5b6b7c">TotalPrice from UnitPrice × Qty</text>
  </g>
  <text x="330" y="242" text-anchor="middle" font-size="10" font-style="italic" fill="#5b6b7c" font-family="Source Serif 4, serif">Simple attributes (one flat value, e.g. DateOfBirth) remain plain ellipses and are stored as ordinary columns.</text>
</svg>
