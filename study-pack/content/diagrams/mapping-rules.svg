<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" width="660" font-family="DM Sans, sans-serif">
  <defs>
    <marker id="mpArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <!-- ER diagram box -->
  <rect x="14" y="55" width="150" height="100" rx="8" fill="#e9f0f9" stroke="#1e56a0" stroke-width="2"/>
  <text x="89" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1b2a">ER DIAGRAM</text>
  <rect x="38" y="94" width="46" height="22" fill="#fff" stroke="#1e56a0" stroke-width="1.2"/>
  <ellipse cx="120" cy="105" rx="24" ry="12" fill="#fff" stroke="#f59e0b" stroke-width="1.2"/>
  <polygon points="89,124 111,136 89,148 67,136" fill="#fff" stroke="#1e7a4f" stroke-width="1.2"/>
  <line x1="164" y1="105" x2="204" y2="105" stroke="#5b6b7c" stroke-width="2" marker-end="url(#mpArrow)"/>
  <!-- rules box -->
  <rect x="208" y="18" width="244" height="174" rx="8" fill="#0d1b2a"/>
  <text x="330" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b" letter-spacing="1">THE 8 MAPPING RULES</text>
  <g font-size="9.5" fill="#e2e8f0">
    <text x="222" y="60">1 · Strong entity → table</text>
    <text x="222" y="77">2 · Composite attribute → flatten</text>
    <text x="222" y="94">3 · Multivalued → new table</text>
    <text x="222" y="111">4 · 1:N → FK on the N side</text>
    <text x="222" y="128">5 · M:N → junction table</text>
    <text x="222" y="145">6 · 1:1 → FK choice / merge</text>
    <text x="222" y="162">7 · Weak entity → composite PK</text>
    <text x="222" y="179">8 · Derived → do not store</text>
  </g>
  <line x1="452" y1="105" x2="492" y2="105" stroke="#5b6b7c" stroke-width="2" marker-end="url(#mpArrow)"/>
  <!-- schema box -->
  <rect x="496" y="55" width="150" height="100" rx="8" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="2"/>
  <text x="571" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1b2a">RELATIONAL</text>
  <text x="571" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#0d1b2a">SCHEMA</text>
  <g font-family="DM Mono, monospace" font-size="8.5" fill="#1e7a4f">
    <text x="512" y="116">STUDENT(...)</text>
    <text x="512" y="130">MODULE(...)</text>
    <text x="512" y="144">ENROLMENT(...)</text>
  </g>
</svg>
