<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" font-family="DM Sans, sans-serif">
  <defs>
    <marker id="tcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="tcArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <text x="18" y="24" font-size="11" font-weight="700" fill="#b3261e">BEFORE — a transitive chain (violates 3NF)</text>
  <rect x="18" y="38" width="130" height="42" rx="7" fill="#0d1b2a"/>
  <text x="83" y="63" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">EmpID</text>
  <line x1="148" y1="59" x2="218" y2="59" stroke="#5b6b7c" stroke-width="2" marker-end="url(#tcArrow)"/>
  <rect x="222" y="38" width="130" height="42" rx="7" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="287" y="63" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92610a">DeptID</text>
  <line x1="352" y1="59" x2="422" y2="59" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tcArrowRed)"/>
  <rect x="426" y="38" width="150" height="42" rx="7" fill="#fbeceb" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="501" y="63" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b3261e">DeptPhone</text>
  <path d="M 83 90 C 83 118 501 118 501 90" fill="none" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#tcArrowRed)"/>
  <text x="292" y="128" text-anchor="middle" font-size="10" font-style="italic" fill="#b3261e" font-family="Source Serif 4, serif">EmpID → DeptPhone only indirectly, through DeptID — a transitive dependency</text>
  <text x="18" y="162" font-size="11" font-weight="700" fill="#1e7a4f">AFTER — cut the chain into two tables (3NF)</text>
  <rect x="18" y="174" width="280" height="42" rx="7" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="1.5"/>
  <text x="158" y="199" text-anchor="middle" font-size="11.5" font-family="DM Mono, monospace" fill="#0d1b2a">Employees(EmpID, Name, DeptID)</text>
  <rect x="330" y="174" width="280" height="42" rx="7" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="1.5"/>
  <text x="470" y="199" text-anchor="middle" font-size="11.5" font-family="DM Mono, monospace" fill="#0d1b2a">Departments(DeptID, DeptPhone)</text>
</svg>
