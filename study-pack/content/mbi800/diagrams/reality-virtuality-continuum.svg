<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" font-family="STIX Two Text, serif">
  <defs>
    <marker id="rvcTick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <rect width="10" height="10" fill="#1b1b1b"/>
    </marker>
  </defs>
  <!-- main axis -->
  <line x1="60" y1="110" x2="580" y2="110" stroke="#1b1b1b" stroke-width="2.4"/>
  <line x1="60" y1="94" x2="60" y2="126" stroke="#1b1b1b" stroke-width="2.4"/>
  <line x1="580" y1="94" x2="580" y2="126" stroke="#1b1b1b" stroke-width="2.4"/>

  <text x="60" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1b1b">Real Environment</text>
  <text x="580" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1b1b">Virtual Environment</text>

  <!-- AR arrow pointing right from real -->
  <line x1="130" y1="80" x2="230" y2="80" stroke="#33415c" stroke-width="1.6" marker-end="url(#rvcArrow)"/>
  <text x="180" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#33415c">Augmented Reality (AR)</text>

  <!-- AV arrow pointing left from virtual -->
  <line x1="510" y1="80" x2="410" y2="80" stroke="#3e5c46" stroke-width="1.6" marker-end="url(#rvcArrow)"/>
  <text x="460" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#3e5c46">Augmented Virtuality (AV)</text>

  <defs>
    <marker id="rvcArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/>
    </marker>
  </defs>

  <!-- MR bracket spanning between -->
  <path d="M120 40 L120 30 L520 30 L520 40" fill="none" stroke="#1b1b1b" stroke-width="1.2"/>
  <text x="320" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1b">Mixed Reality (MR)</text>

  <text x="320" y="185" text-anchor="middle" font-size="10.5" font-style="italic" fill="#454545">Milgram &amp; Kishino, 1994 — A Taxonomy of Mixed Reality Visual Displays</text>
</svg>
