<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" font-family="STIX Two Text, serif">
  <defs>
    <marker id="spdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6a66"/>
    </marker>
  </defs>
  <!-- center -->
  <circle cx="320" cy="230" r="60" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
  <text x="320" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1b">Coalignment</text>
  <text x="320" y="241" text-anchor="middle" font-size="9.5" font-style="italic" fill="#454545">Rational Adaptation</text>

  <!-- six surrounding boxes -->
  <g font-size="12" font-weight="700" fill="#1b1b1b">
    <rect x="230" y="20" width="180" height="46" fill="none" stroke="#33415c" stroke-width="1.3"/>
    <text x="320" y="48" text-anchor="middle">Comprehensiveness</text>

    <rect x="20" y="120" width="180" height="46" fill="none" stroke="#33415c" stroke-width="1.3"/>
    <text x="110" y="148" text-anchor="middle">Formalization</text>

    <rect x="460" y="120" width="160" height="46" fill="none" stroke="#33415c" stroke-width="1.3"/>
    <text x="540" y="148" text-anchor="middle">Focus</text>

    <rect x="20" y="300" width="180" height="46" fill="none" stroke="#33415c" stroke-width="1.3"/>
    <text x="110" y="328" text-anchor="middle">Flow</text>

    <rect x="460" y="300" width="160" height="46" fill="none" stroke="#3e5c46" stroke-width="1.3"/>
    <text x="540" y="322" text-anchor="middle">Participation</text>

    <rect x="230" y="394" width="180" height="46" fill="none" stroke="#3e5c46" stroke-width="1.3"/>
    <text x="320" y="422" text-anchor="middle">Consistency</text>
  </g>

  <!-- connecting lines to center -->
  <g stroke="#8f8f8a" stroke-width="1" stroke-dasharray="3 3">
    <line x1="320" y1="66" x2="320" y2="172"/>
    <line x1="200" y1="150" x2="272" y2="205"/>
    <line x1="460" y1="150" x2="368" y2="205"/>
    <line x1="200" y1="315" x2="272" y2="258"/>
    <line x1="460" y1="315" x2="368" y2="258"/>
    <line x1="320" y1="394" x2="320" y2="290"/>
  </g>

  <text x="320" y="10" text-anchor="middle" font-size="10.5" fill="#454545" font-style="italic">Rational tendencies (navy: comprehensiveness, formalization, focus, flow) + Adaptive tendencies (teal: participation, consistency)</text>
</svg>
