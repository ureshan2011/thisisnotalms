<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" font-family="STIX Two Text, serif">
  <defs>
    <marker id="sflArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b1b1b"/>
    </marker>
    <marker id="sflArrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6a66"/>
    </marker>
  </defs>
  <!-- Control box (top) -->
  <rect x="235" y="20" width="170" height="56" fill="none" stroke="#7d3a34" stroke-width="1.6"/>
  <text x="320" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#7d3a34">CONTROL</text>
  <text x="320" y="60" text-anchor="middle" font-size="11.5" fill="#1b1b1b">Poor sales management</text>

  <!-- Input box -->
  <rect x="20" y="140" width="150" height="56" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
  <text x="95" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1b1b">INPUT</text>
  <text x="95" y="180" text-anchor="middle" font-size="11" fill="#1b1b1b">Inadequate selling effort</text>

  <!-- Processing box -->
  <rect x="235" y="140" width="170" height="56" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
  <text x="320" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1b1b">PROCESSING</text>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="#1b1b1b">Out-of-date sales procedures</text>

  <!-- Output box -->
  <rect x="465" y="140" width="155" height="56" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
  <text x="542" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#1b1b1b">OUTPUT</text>
  <text x="542" y="180" text-anchor="middle" font-size="11" fill="#1b1b1b">Poor sales performance</text>

  <!-- solid flow arrows -->
  <line x1="170" y1="168" x2="230" y2="168" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#sflArrow)"/>
  <line x1="405" y1="168" x2="460" y2="168" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#sflArrow)"/>
  <line x1="320" y1="140" x2="320" y2="80" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#sflArrow)"/>

  <!-- feedback loop: output -> control (dashed, "incorrect sales info") -->
  <path d="M542 138 L542 100 L410 100 L410 48" fill="none" stroke="#6a6a66" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#sflArrowDash)"/>
  <text x="475" y="94" text-anchor="middle" font-size="10" font-style="italic" fill="#6a6a66">incorrect sales information</text>

  <!-- feedback: control -> input (dashed, "feedback") -->
  <path d="M235 48 L120 48 L120 136" fill="none" stroke="#6a6a66" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#sflArrowDash)"/>
  <text x="175" y="42" text-anchor="middle" font-size="10" font-style="italic" fill="#6a6a66">feedback</text>

  <text x="320" y="240" text-anchor="middle" font-size="12" font-style="italic" fill="#454545">Poor management, acting on bad information, reinforces the conditions that produced it.</text>
</svg>
