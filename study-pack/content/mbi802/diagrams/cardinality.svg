<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" font-family="DM Sans, sans-serif">
  <!-- 1:1 -->
  <g>
    <text x="20" y="40" font-size="12" font-weight="700" fill="#0d1b2a">1 : 1</text>
    <rect x="80" y="20" width="120" height="40" fill="#e9f0f9" stroke="#1e56a0" stroke-width="1.8"/>
    <text x="140" y="45" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d1b2a">EMPLOYEE</text>
    <line x1="200" y1="40" x2="265" y2="40" stroke="#5b6b7c" stroke-width="1.6"/>
    <text x="212" y="33" font-size="10.5" font-weight="700" fill="#92610a">1</text>
    <polygon points="325,16 385,40 325,64 265,40" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="1.8"/>
    <text x="325" y="44" text-anchor="middle" font-size="10.5" font-style="italic" fill="#0d1b2a">holds</text>
    <line x1="385" y1="40" x2="450" y2="40" stroke="#5b6b7c" stroke-width="1.6"/>
    <text x="436" y="33" font-size="10.5" font-weight="700" fill="#92610a">1</text>
    <rect x="450" y="20" width="120" height="40" fill="#e9f0f9" stroke="#1e56a0" stroke-width="1.8"/>
    <text x="510" y="45" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d1b2a">PASSPORT</text>
    <text x="590" y="45" font-size="9.5" fill="#5b6b7c">each side: one match</text>
  </g>
  <!-- 1:N -->
  <g transform="translate(0,80)">
    <text x="20" y="40" font-size="12" font-weight="700" fill="#0d1b2a">1 : N</text>
    <rect x="80" y="20" width="120" height="40" fill="#e9f0f9" stroke="#1e56a0" stroke-width="1.8"/>
    <text x="140" y="45" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d1b2a">TEACHER</text>
    <line x1="200" y1="40" x2="265" y2="40" stroke="#5b6b7c" stroke-width="1.6"/>
    <text x="212" y="33" font-size="10.5" font-weight="700" fill="#92610a">1</text>
    <polygon points="325,16 385,40 325,64 265,40" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="1.8"/>
    <text x="325" y="44" text-anchor="middle" font-size="10.5" font-style="italic" fill="#0d1b2a">teaches</text>
    <line x1="385" y1="40" x2="450" y2="40" stroke="#5b6b7c" stroke-width="1.6"/>
    <text x="432" y="33" font-size="10.5" font-weight="700" fill="#92610a">N</text>
    <rect x="450" y="20" width="120" height="40" fill="#e9f0f9" stroke="#1e56a0" stroke-width="1.8"/>
    <text x="510" y="45" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d1b2a">COURSE</text>
    <text x="590" y="38" font-size="9.5" fill="#5b6b7c">one teacher, many courses;</text>
    <text x="590" y="51" font-size="9.5" fill="#5b6b7c">each course: one teacher</text>
  </g>
  <!-- M:N -->
  <g transform="translate(0,160)">
    <text x="20" y="40" font-size="12" font-weight="700" fill="#0d1b2a">M : N</text>
    <rect x="80" y="20" width="120" height="40" fill="#e9f0f9" stroke="#1e56a0" stroke-width="1.8"/>
    <text x="140" y="45" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d1b2a">STUDENT</text>
    <line x1="200" y1="40" x2="265" y2="40" stroke="#5b6b7c" stroke-width="1.6"/>
    <text x="210" y="33" font-size="10.5" font-weight="700" fill="#92610a">M</text>
    <polygon points="325,16 385,40 325,64 265,40" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="1.8"/>
    <text x="325" y="44" text-anchor="middle" font-size="10.5" font-style="italic" fill="#0d1b2a">enrolls</text>
    <line x1="385" y1="40" x2="450" y2="40" stroke="#5b6b7c" stroke-width="1.6"/>
    <text x="432" y="33" font-size="10.5" font-weight="700" fill="#92610a">N</text>
    <rect x="450" y="20" width="120" height="40" fill="#e9f0f9" stroke="#1e56a0" stroke-width="1.8"/>
    <text x="510" y="45" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d1b2a">COURSE</text>
    <text x="590" y="38" font-size="9.5" fill="#5b6b7c">many on both sides —</text>
    <text x="590" y="51" font-size="9.5" fill="#5b6b7c">needs a junction table</text>
  </g>
</svg>
