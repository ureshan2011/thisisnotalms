<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 180" width="660" font-family="DM Sans, sans-serif">
  <g>
    <rect x="20" y="26" width="130" height="52" fill="#e9f0f9" stroke="#1e56a0" stroke-width="2"/>
    <text x="85" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1b2a">STUDENT</text>
    <text x="85" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e56a0">Entity</text>
    <text x="85" y="117" text-anchor="middle" font-size="9" fill="#5b6b7c">a real-world thing</text>
    <text x="85" y="130" text-anchor="middle" font-size="9" fill="#5b6b7c">→ becomes a table</text>
  </g>
  <g>
    <ellipse cx="250" cy="52" rx="66" ry="27" fill="#fdf3e0" stroke="#f59e0b" stroke-width="2"/>
    <text x="250" y="57" text-anchor="middle" font-size="12.5" fill="#0d1b2a">Name</text>
    <text x="250" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92610a">Attribute</text>
    <text x="250" y="117" text-anchor="middle" font-size="9" fill="#5b6b7c">a property</text>
    <text x="250" y="130" text-anchor="middle" font-size="9" fill="#5b6b7c">→ becomes a column</text>
  </g>
  <g>
    <ellipse cx="415" cy="52" rx="66" ry="27" fill="#fdf3e0" stroke="#f59e0b" stroke-width="2"/>
    <text x="415" y="57" text-anchor="middle" font-size="12.5" font-weight="700" text-decoration="underline" fill="#0d1b2a">StudentID</text>
    <text x="415" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#92610a">Key attribute</text>
    <text x="415" y="117" text-anchor="middle" font-size="9" fill="#5b6b7c">unique identifier (underlined)</text>
    <text x="415" y="130" text-anchor="middle" font-size="9" fill="#5b6b7c">→ becomes the primary key</text>
  </g>
  <g>
    <polygon points="575,24 645,52 575,80 505,52" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="2"/>
    <text x="575" y="57" text-anchor="middle" font-size="12" font-style="italic" fill="#0d1b2a">enrolls</text>
    <text x="575" y="102" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e7a4f">Relationship</text>
    <text x="575" y="117" text-anchor="middle" font-size="9" fill="#5b6b7c">a verb linking entities</text>
    <text x="575" y="130" text-anchor="middle" font-size="9" fill="#5b6b7c">→ FK or junction table</text>
  </g>
  <text x="330" y="164" text-anchor="middle" font-size="10" font-style="italic" fill="#5b6b7c" font-family="Source Serif 4, serif">Lines connect everything — attributes to entities, entities to relationship diamonds. No floating shapes.</text>
</svg>
