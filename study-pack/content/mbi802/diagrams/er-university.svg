<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" font-family="DM Sans, sans-serif">
  <!-- connection lines first (behind shapes) -->
  <g stroke="#5b6b7c" stroke-width="1.5">
    <!-- teacher attrs -->
    <line x1="95" y1="60" x2="60" y2="30"/>
    <line x1="95" y1="80" x2="52" y2="110"/>
    <!-- teacher - teaches - course -->
    <line x1="160" y1="70" x2="280" y2="70"/>
    <line x1="360" y1="70" x2="480" y2="70"/>
    <!-- course attrs -->
    <line x1="545" y1="50" x2="580" y2="26"/>
    <line x1="570" y1="90" x2="600" y2="116"/>
    <!-- course - enrolls -->
    <line x1="520" y1="90" x2="520" y2="180"/>
    <!-- enrolls - student -->
    <line x1="480" y1="220" x2="230" y2="256"/>
    <!-- enrolls attrs -->
    <line x1="560" y1="230" x2="600" y2="262"/>
    <!-- student attrs -->
    <line x1="130" y1="278" x2="90" y2="310"/>
    <line x1="120" y1="240" x2="66" y2="216"/>
  </g>
  <!-- TEACHER -->
  <rect x="95" y="45" width="130" height="46" fill="#e9f0f9" stroke="#1e56a0" stroke-width="2"/>
  <text x="160" y="73" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d1b2a">TEACHER</text>
  <ellipse cx="60" cy="26" rx="55" ry="19" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="60" y="30" text-anchor="middle" font-size="10.5" font-weight="700" text-decoration="underline" fill="#0d1b2a">TeacherID</text>
  <ellipse cx="48" cy="116" rx="44" ry="19" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="48" y="120" text-anchor="middle" font-size="10.5" fill="#0d1b2a">Name</text>
  <!-- teaches -->
  <polygon points="320,42 380,70 320,98 260,70" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="2"/>
  <text x="320" y="74" text-anchor="middle" font-size="11" font-style="italic" fill="#0d1b2a">teaches</text>
  <text x="238" y="62" font-size="11" font-weight="700" fill="#92610a">1</text>
  <text x="452" y="62" font-size="11" font-weight="700" fill="#92610a">N</text>
  <!-- COURSE -->
  <rect x="455" y="47" width="130" height="46" fill="#e9f0f9" stroke="#1e56a0" stroke-width="2"/>
  <text x="520" y="75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d1b2a">COURSE</text>
  <ellipse cx="592" cy="22" rx="58" ry="18" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="592" y="26" text-anchor="middle" font-size="10.5" font-weight="700" text-decoration="underline" fill="#0d1b2a">CourseID</text>
  <ellipse cx="608" cy="126" rx="44" ry="18" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="608" y="130" text-anchor="middle" font-size="10.5" fill="#0d1b2a">Title</text>
  <!-- enrolls -->
  <polygon points="520,180 580,212 520,244 460,212" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="2"/>
  <text x="520" y="216" text-anchor="middle" font-size="11" font-style="italic" fill="#0d1b2a">enrolls</text>
  <text x="530" y="170" font-size="11" font-weight="700" fill="#92610a">N</text>
  <text x="428" y="240" font-size="11" font-weight="700" fill="#92610a">M</text>
  <ellipse cx="614" cy="272" rx="46" ry="18" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="614" y="276" text-anchor="middle" font-size="10.5" fill="#0d1b2a">Grade</text>
  <!-- STUDENT -->
  <rect x="100" y="233" width="130" height="46" fill="#e9f0f9" stroke="#1e56a0" stroke-width="2"/>
  <text x="165" y="261" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d1b2a">STUDENT</text>
  <ellipse cx="62" cy="210" rx="55" ry="19" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="62" y="214" text-anchor="middle" font-size="10.5" font-weight="700" text-decoration="underline" fill="#0d1b2a">StudentID</text>
  <ellipse cx="84" cy="313" rx="44" ry="17" fill="#fdf3e0" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="84" y="317" text-anchor="middle" font-size="10.5" fill="#0d1b2a">Name</text>
  <text x="330" y="322" font-size="9.5" font-style="italic" fill="#5b6b7c" font-family="Source Serif 4, serif">Grade hangs off the enrolls relationship itself — it belongs to the pair (student, course), not to either entity alone.</text>
</svg>
