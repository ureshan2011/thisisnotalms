<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" font-family="DM Sans, sans-serif">
  <defs>
    <marker id="fdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e56a0"/>
    </marker>
  </defs>
  <rect x="60" y="28" width="170" height="52" rx="8" fill="#0d1b2a"/>
  <text x="145" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">X</text>
  <text x="145" y="68" text-anchor="middle" font-size="10" fill="#f59e0b">Determinant (left side)</text>
  <line x1="240" y1="54" x2="390" y2="54" stroke="#1e56a0" stroke-width="2.5" marker-end="url(#fdArrow)"/>
  <text x="316" y="44" text-anchor="middle" font-size="11" font-weight="600" fill="#1e56a0">determines</text>
  <rect x="400" y="28" width="170" height="52" rx="8" fill="#e9f0f9" stroke="#1e56a0" stroke-width="1.5"/>
  <text x="485" y="50" text-anchor="middle" font-size="15" font-weight="700" fill="#0d1b2a">Y</text>
  <text x="485" y="68" text-anchor="middle" font-size="10" fill="#1e56a0">Dependent (right side)</text>
  <g font-family="DM Mono, monospace" font-size="11.5">
    <text x="70" y="118" fill="#1e56a0">StudentID → StudentName</text>
    <text x="70" y="138" fill="#5b6b7c" font-family="Source Serif 4, serif" font-size="10" font-style="italic">one student ID maps to exactly one name</text>
    <text x="360" y="118" fill="#1e56a0">{OrderID, ProductID} → Quantity</text>
    <text x="360" y="138" fill="#5b6b7c" font-family="Source Serif 4, serif" font-size="10" font-style="italic">composite determinant: both values are needed</text>
  </g>
</svg>
