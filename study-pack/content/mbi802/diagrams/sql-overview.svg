<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 170" width="660" font-family="DM Sans, sans-serif">
  <defs>
    <marker id="sqArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
  </defs>
  <rect x="20" y="45" width="150" height="80" rx="8" fill="#e9f0f9" stroke="#1e56a0" stroke-width="2"/>
  <text x="95" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#0d1b2a">Your application</text>
  <text x="95" y="100" text-anchor="middle" font-size="9.5" fill="#5b6b7c">or MySQL Workbench</text>
  <line x1="170" y1="75" x2="250" y2="75" stroke="#5b6b7c" stroke-width="2" marker-end="url(#sqArrow)"/>
  <text x="210" y="63" text-anchor="middle" font-size="10" font-family="DM Mono, monospace" fill="#1e56a0">SQL</text>
  <line x1="250" y1="95" x2="170" y2="95" stroke="#5b6b7c" stroke-width="2" marker-end="url(#sqArrow)"/>
  <text x="210" y="112" text-anchor="middle" font-size="10" fill="#5b6b7c">results</text>
  <rect x="250" y="30" width="180" height="110" rx="8" fill="#0d1b2a"/>
  <text x="340" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MySQL Server</text>
  <text x="340" y="76" text-anchor="middle" font-size="9.5" fill="#94a3b8">interprets SQL, manages storage,</text>
  <text x="340" y="89" text-anchor="middle" font-size="9.5" fill="#94a3b8">enforces keys and constraints</text>
  <text x="340" y="115" text-anchor="middle" font-size="9" fill="#f59e0b" font-family="DM Mono, monospace">CREATE · INSERT · SELECT · UPDATE · DELETE</text>
  <line x1="430" y1="85" x2="505" y2="85" stroke="#5b6b7c" stroke-width="2" marker-end="url(#sqArrow)"/>
  <g>
    <ellipse cx="575" cy="52" rx="60" ry="14" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="2"/>
    <path d="M 515 52 v 56 a 60 14 0 0 0 120 0 v -56" fill="#e8f4ee" stroke="#1e7a4f" stroke-width="2"/>
    <ellipse cx="575" cy="80" rx="60" ry="14" fill="none" stroke="#1e7a4f" stroke-width="1.2"/>
    <text x="575" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#0d1b2a">Database</text>
    <text x="575" y="146" text-anchor="middle" font-size="9" fill="#5b6b7c">tables, rows, indexes</text>
  </g>
</svg>
